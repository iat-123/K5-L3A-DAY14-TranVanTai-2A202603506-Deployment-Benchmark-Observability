# Railway: build từ Dockerfile, app nghe theo $PORT (xử lý trong CMD của Dockerfile).
# Đặt biến trên Railway: AGENT_API_KEY, REDIS_URL (trỏ tới Redis service), ENVIRONMENT=production
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
