# Quality gate (Exercise 7.3): chặn merge khi agent v2 giảm chất lượng.
# run_eval.py trả exit code 1 khi accuracy < --min-accuracy hoặc có câu regression so với baseline
# → step fail → job fail → branch protection "Require status checks" chặn merge.
name: eval-gate

on:
  pull_request:
    paths:
      - "06-lab-complete/benchmark-observability/develop/**"
  workflow_dispatch:

jobs:
  eval:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 06-lab-complete/benchmark-observability/develop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Start agent v2
        env:
          AGENT_VERSION: v2
          PORT: "8002"
          MOCK_ERROR_RATE: "0"   # tắt lỗi giả lập để gate chỉ phản ánh chất lượng câu trả lời
        run: |
          nohup python app.py > agent.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:8002/health && break; sleep 1; done

      - name: Eval + quality gate (100% accuracy, no regression vs baseline)
        run: |
          python eval/run_eval.py --url http://localhost:8002 \
            --min-accuracy 1.0 --baseline reports/eval_v2.json --out eval_ci.json

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: |
            06-lab-complete/benchmark-observability/develop/eval_ci.json
            06-lab-complete/benchmark-observability/develop/agent.log
